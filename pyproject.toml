[build-system]
build-backend = "uv_build"

requires = [
  "uv-build>=0.8.17,<0.9",
]

[project]
name = "eryn"

version = "1.2.6"

description = "Eryn: an omni-MCMC sampling package."

readme = "README.md"

authors = [
  { name = "Michael Katz", email = "mikekatz04@gmail.com" },
]
requires-python = ">=3.10"

classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Programming Language :: C++",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "exceptiongroup; python_version<'3.11'", # To access ExceptionGroup with Python 3.9 and 3.10
  "gpubackendtools",                       # GBT backend registry: numpy/cupy access for paraensemble
  "h5py",
  "jsonschema",                            # To validate content of file registry
  "matplotlib",
  "numpy",
  "pandas",
  "corner",
  "seaborn",                               # for runtime plots
  "nvidia-ml-py",                          # To detect CUDA version if any
  "platformdirs",                          # To locate config and data dir on all platforms
  "pydantic",                              # To handle citations and references with advanced dataclasses
  "pyyaml",                                # To read file registry
  "requests",                              # To download files automatically
  "rich",                                  # To display downlaod progress bar
  "scipy",
  "tqdm",
  "wrapt",
  "pytest>=9.1.1",
]

optional-dependencies.flow = [
  "torch>=2.1",
  "zuko>=1.1",
]

optional-dependencies.doc = [
  "ipykernel",
  "ipython",
  "ipywidgets",
  "myst-parser",
  "nbsphinx",
  "pypandoc",
  "sphinx",
  "sphinx-rtd-theme",
  "sphinx-tippy",
  "corner"
]

optional-dependencies.testing = [
  "matplotlib",
  "corner",
  "chainconsumer",
  "scienceplots",                          # for runtime plots
]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.pyproject-fmt]
max_supported_python = "3.13"

# Eryn modernization (2026-06-04): ruff config landed as part of the
# modernization sprint. line-length 100 matches the punch list; target
# py310 matches `requires-python`. Initial enabled rule sets are kept
# conservative (pyflakes + pycodestyle + isort) so the first formatting
# sweep doesn't tear through too much code at once; UP / B / SIM can be
# enabled later once typing modernization (item 3) and f-string pass
# (item 5) have landed.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
]
ignore = [
  "E501", # let the formatter handle long lines
  "E731", # allow lambda assignments (heavy use in moves/)
  "E741", # allow ambiguous variable names (l for likelihood etc.)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage]
paths.source = [
  "src/",
  "**/site-packages/",
]

report.omit = [
  "*/eryn/_version.py",
  "*/eryn/tests/*.py",
  "*/eryn/git_version.py",
  "*/eryn_backend_*/git_version.py",
]
